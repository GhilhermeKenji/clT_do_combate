<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrinho | CLTS do Combate</title><link rel="stylesheet" href="carrinho.css"></head><body>
<header class="header"><a class="logo" href="Index.html"><img src="images/logo-clts.png" alt="CLTS"></a><nav><a href="Index.html">Início</a><a href="catalogo.html">Catálogo</a></nav><a class="back" href="catalogo.html">Continuar comprando</a></header>
<main class="cart-page"><h1>Seu carrinho</h1><p class="subtitle">Revise seus produtos antes de finalizar.</p><div class="cart-layout"><section><div id="cart-items"></div><div id="empty-cart" class="empty" style="display:none"><h2>Seu carrinho está vazio</h2><a href="catalogo.html">Ver produtos</a></div></section><aside class="summary"><h2>Resumo</h2><div><span>Subtotal</span><strong id="subtotal">R$ 0,00</strong></div><div><span>Frete</span><strong id="shipping">A calcular</strong></div><hr><div class="total"><span>Total</span><strong id="total">R$ 0,00</strong></div><div class="cep"><label for="cep">CEP</label><div><input id="cep" inputmode="numeric" maxlength="9" placeholder="00000-000"><button id="calculate-shipping">CALCULAR</button></div><small id="shipping-message"></small></div><button id="checkout-button" class="checkout">FINALIZAR COMPRA</button><p class="warning">Produtos que ficarem indisponíveis não entram no total e bloqueiam a finalização até serem removidos.</p></aside></div></main><div id="toast" class="toast"></div><script src="produtos.js"></script><script src="Script.js"></script><script src="carrinho.js"></script></body></html>
