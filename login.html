<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — CLTS do Combate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #020b11;
      color: #f7fbff;
      font-family: Inter, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: #04131c;
      border: 1px solid #0e3a49;
      box-shadow: 0 0 40px rgba(0, 232, 255, 0.08);
      padding: 40px 34px;
    }

    .brand-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .brand-logo img {
      height: 44px;
      width: auto;
      display: block;
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-header h1 {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .login-header p {
      font-size: 13px;
      color: #8ca1ae;
    }

    .alert-box {
      display: none;
      padding: 12px 14px;
      margin-bottom: 18px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #ff2e63;
      background: rgba(255, 46, 99, 0.12);
      color: #ff9cb5;
    }

    .alert-box.info {
      border-color: #00e8ff;
      background: rgba(0, 232, 255, 0.1);
      color: #8cf5ff;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #f7fbff;
      margin-bottom: 8px;
    }

    .password-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-control {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      background: #071923;
      border: 1px solid #1d4454;
      color: #f7fbff;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-control:focus {
      border-color: #00e8ff;
      box-shadow: 0 0 0 2px rgba(0, 232, 255, 0.15);
    }

    /* Mantém o fundo escuro mesmo se o navegador tentar preencher */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #f7fbff;
      -webkit-box-shadow: 0 0 0 1000px #071923 inset;
      transition: background-color 5000s ease-in-out 0s;
    }

    .toggle-pass {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: #8ca1ae;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
    }

    .toggle-pass:hover {
      color: #00e8ff;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      font-size: 12px;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #c2d1da;
      cursor: pointer;
    }

    .remember-label input {
      width: 15px;
      height: 15px;
      accent-color: #00e8ff;
      cursor: pointer;
    }

    .forgot-link {
      color: #00e8ff;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      font-size: 12px;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      background: #00e8ff;
      color: #001016;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      transition: filter 0.2s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
      filter: brightness(1.08);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 24px 0;
      color: #6a808d;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #143341;
    }

    .register-prompt {
      text-align: center;
      font-size: 13px;
      color: #8ca1ae;
      margin-bottom: 18px;
    }

    .register-prompt a {
      color: #00e8ff;
      font-weight: 800;
      text-decoration: none;
    }

    .register-prompt a:hover {
      text-decoration: underline;
    }

    .back-store {
      display: block;
      text-align: center;
      font-size: 12px;
      color: #7d93a0;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .back-store:hover {
      color: #f7fbff;
    }
  </style>
</head>
<body>

  <main class="login-card">
    <div class="brand-logo">
      <a href="Index.html">
        <img src="images/logo-clts.png" alt="CLTS do Combate">
      </a>
    </div>

    <div class="login-header">
      <h1>Bem-vindo de volta</h1>
      <p>Entre na sua conta para continuar.</p>
    </div>

    <div id="loginAlert" class="alert-box"></div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="loginEmail">E-mail</label>
        <input
          type="email"
          id="loginEmail"
          class="form-control"
          placeholder="seuemail@exemplo.com"
          autocomplete="off"
          required
        >
      </div>

      <div class="form-group">
        <label for="loginSenha">Senha</label>
        <div class="password-wrap">
          <input
            type="password"
            id="loginSenha"
            class="form-control"
            placeholder="••••••••"
            autocomplete="new-password"
            required
          >
          <button type="button" id="toggleSenhaBtn" class="toggle-pass">Mostrar</button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-label">
          <input type="checkbox" id="lembrarCheck">
          <span>Lembrar de mim</span>
        </label>
        <button type="button" id="esqueciSenhaBtn" class="forgot-link">Esqueci minha senha</button>
      </div>

      <button type="submit" class="btn-submit">Entrar</button>
    </form>

    <div class="divider">ou</div>

    <p class="register-prompt">
      Ainda não tem uma conta? <a href="cadastro.html">Criar conta</a>
    </p>

    <a href="Index.html" class="back-store">← Voltar para a loja</a>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const EMAILS_ADMIN = [
        "guilhermecanada93@gmail.com",
        "gui.kenn1221@gmail.com"
      ];

      const KEYS = {
        USERS: "clts-usuarios",
        USER_LOGGED: "clts-usuario-logado",
        ADMIN_LOGGED: "clts-admin-logado",
        REMEMBER: "clts-lembrar-email"
      };

      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("loginEmail");
      const senhaInput = document.getElementById("loginSenha");
      const lembrarCheck = document.getElementById("lembrarCheck");
      const alertBox = document.getElementById("loginAlert");
      const toggleSenhaBtn = document.getElementById("toggleSenhaBtn");
      const esqueciSenhaBtn = document.getElementById("esqueciSenhaBtn");

      function mostrarAlerta(mensagem, tipo = "erro") {
        alertBox.textContent = mensagem;
        alertBox.className = tipo === "info" ? "alert-box info" : "alert-box";
        alertBox.style.display = "block";
      }

      // Carrega e-mail memorizado apenas se o utilizador ativou "Lembrar de mim"
      const emailSalvo = localStorage.getItem(KEYS.REMEMBER);
      if (emailSalvo) {
        emailInput.value = emailSalvo;
        lembrarCheck.checked = true;
      }

      // Mostrar / Ocultar senha
      toggleSenhaBtn.addEventListener("click", () => {
        const oculto = senhaInput.type === "password";
        senhaInput.type = oculto ? "text" : "password";
        toggleSenhaBtn.textContent = oculto ? "Ocultar" : "Mostrar";
      });

      // Aviso de recuperação de senha
      esqueciSenhaBtn.addEventListener("click", () => {
        mostrarAlerta(
          "A recuperação automática por e-mail requer um servidor ativo. Caso tenha esquecido sua senha local, crie um novo cadastro ou redefina via painel.",
          "info"
        );
      });

      // Submissão do formulário de login
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        alertBox.style.display = "none";

        const email = emailInput.value.trim().toLowerCase();
        const senha = senhaInput.value;

        let usuarios = [];
        try {
          usuarios = JSON.parse(localStorage.getItem(KEYS.USERS) || "[]");
        } catch {
          usuarios = [];
        }

        const usuarioEncontrado = usuarios.find(
          (u) => String(u.email || "").trim().toLowerCase() === email && String(u.senha || "") === senha
        );

        if (!usuarioEncontrado) {
          mostrarAlerta("E-mail ou senha incorretos. Verifique os dados ou crie uma conta.");
          return;
        }

        // Gerencia "Lembrar de mim"
        if (lembrarCheck.checked) {
          localStorage.setItem(KEYS.REMEMBER, email);
        } else {
          localStorage.removeItem(KEYS.REMEMBER);
        }

        // Salva sessão do usuário logado
        localStorage.setItem(KEYS.USER_LOGGED, JSON.stringify(usuarioEncontrado));

        // Verifica se é administrador
        if (EMAILS_ADMIN.includes(email)) {
          localStorage.setItem(KEYS.ADMIN_LOGGED, "true");
          window.location.href = "admin.html";
          return;
        }

        localStorage.removeItem(KEYS.ADMIN_LOGGED);
        window.location.href = "Index.html";
      });
    });
  </script>
</body>
</html>
