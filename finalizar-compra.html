<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finalizar compra | CLTS do Combate</title><link rel="stylesheet" href="finalizar-compra.css"></head><body>
<header class="header"><a href="Index.html"><img src="images/logo-clts.png" alt="CLTS"></a><a href="carrinho.html">← Voltar ao carrinho</a></header>
<main class="checkout-page"><h1>Finalizar compra</h1><p class="sub">Preencha seus dados para concluir o pedido.</p><form id="checkout-form"><section><h2>Entrega</h2><div class="grid"><label>Nome<input id="nome" required></label><label>E-mail<input id="email" type="email" required></label><label>CEP<input id="cep" required maxlength="9"></label><label>Endereço<input id="endereco" required></label><label>Número<input id="numero" required></label><label>Cidade<input id="cidade" required></label><label>Estado<input id="estado" required maxlength="2"></label></div><h2>Pagamento</h2><label>Forma de pagamento<select id="pagamento"><option>Pix</option><option>Cartão de crédito</option><option>Boleto</option></select></label></section><aside><h2>Resumo</h2><div id="checkout-items"></div><hr><div><span>Subtotal</span><strong id="subtotal">R$ 0,00</strong></div><div><span>Frete</span><strong id="shipping">R$ 19,90</strong></div><div class="total"><span>Total</span><strong id="total">R$ 0,00</strong></div><button class="finish" type="submit" id="finish-button">CONFIRMAR PEDIDO</button><p id="checkout-message"></p></aside></form></main><script src="produtos.js"></script><script src="Script.js"></script><script src="finalizar-compra.js"></script></body></html>
