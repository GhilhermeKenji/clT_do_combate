<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Admin | CLTS do Combate</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#020b11;color:#f7fbff;font-family:Inter,system-ui,sans-serif}.admin{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.side{background:#041019;border-right:1px solid #173b49;padding:25px 18px;position:sticky;top:0;height:100vh}.side img{width:160px;margin:0 auto 35px;display:block}.side a,.side button{display:block;width:100%;padding:13px 12px;background:transparent;border:0;color:#aab9bf;text-decoration:none;text-align:left;font-weight:800;font-size:12px;cursor:pointer}.side a:hover,.side button:hover{color:#00e8ff;background:#071923}.main{padding:35px;max-width:1400px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.top p{color:#8799a4;margin-top:6px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:25px}.stat{background:#071923;border:1px solid #193e4c;padding:20px}.stat small{color:#8799a4}.stat strong{display:block;font-size:28px;margin-top:7px}.panel{background:#071923;border:1px solid #193e4c;padding:22px;margin-bottom:20px}.panel h2{margin-bottom:18px}.form{display:grid;grid-template-columns:2fr 1fr 1fr 2fr;gap:12px}.field label{display:block;color:#9baab5;font-size:10px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;background:#031019;border:1px solid #294653;color:#fff;padding:10px;outline:none}.field textarea{min-height:80px;resize:vertical}.wide{grid-column:span 2}.availability{display:flex;align-items:center;gap:8px;color:#c5d0d5;font-size:12px;margin-top:10px}.actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid #00e8ff;background:#00e8ff;color:#001016;padding:11px 15px;font-weight:900;cursor:pointer}.btn.alt{background:transparent;color:#00e8ff}.btn.danger{border-color:#ff6d6d;background:transparent;color:#ff9b9b}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.product{border:1px solid #193e4c;padding:16px}.product.off{opacity:.65}.product h3{margin:8px 0}.product p{font-size:11px;color:#8799a4;line-height:1.5}.tag{display:inline-block;padding:5px 7px;background:#00e8ff;color:#001016;font-size:9px;font-weight:900}.tag.off{background:#3e4b51;color:#fff}.product-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.empty{color:#8799a4}.toast{position:fixed;bottom:25px;right:25px;background:#071923;border:1px solid #00e8ff;padding:13px 18px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}@media(max-width:700px){.admin{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;flex-wrap:wrap;gap:5px}.side img{width:130px;margin:0 100% 15px 0}.side a,.side button{width:auto}.main{padding:20px}.products{grid-template-columns:1fr}}
</style></head><body><div class="admin"><aside class="side"><img src="images/logo-clts.png" alt="CLTS"><a href="Index.html">🏠 Ver loja</a><a href="#produtos">📦 Produtos</a><a href="#novo">➕ Novo produto</a><button id="logout">↪ Sair</button></aside><main class="main"><div class="top"><div><h1>Painel administrativo</h1><p>Gerencie os produtos da CLTS do Combate.</p></div></div><div class="stats"><div class="stat"><small>Total</small><strong id="stat-total">0</strong></div><div class="stat"><small>Disponíveis</small><strong id="stat-available">0</strong></div><div class="stat"><small>Indisponíveis</small><strong id="stat-off">0</strong></div><div class="stat"><small>Usuários</small><strong id="stat-users">0</strong></div></div><section class="panel" id="novo"><h2 id="form-title">Cadastrar produto</h2><form id="product-form"><input type="hidden" id="product-id"><input type="hidden" id="product-original-category"><div class="form"><div class="field"><label>Nome</label><input id="product-name" required></div><div class="field"><label>Categoria</label><select id="product-category"><option value="jiu-jitsu">Jiu-Jitsu</option><option value="judo">Judô</option><option value="muay-thai">Muay Thai</option><option value="boxe">Boxe</option><option value="karate">Karatê</option><option value="taekwondo">Taekwondo</option><option value="mma">MMA</option><option value="acessorios">Acessórios</option></select></div><div class="field"><label>Preço</label><input id="product-price" type="number" step="0.01" min="0" required></div><div class="field"><label>Imagem</label><input id="product-image" placeholder="images/arquivo.jpg"></div><div class="field wide"><label>Descrição</label><textarea id="product-description"></textarea></div><div class="field"><label>Disponibilidade</label><label class="availability"><input type="checkbox" id="product-available" checked> Disponível para venda</label></div><div class="actions wide"><button class="btn" type="submit">SALVAR PRODUTO</button><button class="btn alt" id="cancel-edit" type="button">LIMPAR</button></div></div></form></section><section class="panel" id="produtos"><h2>Produtos</h2><div id="products-list" class="products"></div></section></main></div><div id="toast" class="toast"></div><script src="produtos.js"></script><script src="admin.js"></script></body></html>
